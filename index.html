<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گلدین | Goldin</title>
    <link rel="preload"
          href="./composeResources/goldin.shared.generated.resources/font/iranyekan.ttf"
          as="font" type="font/ttf"
          crossorigin/>
    <link rel="preload"
          href="./composeResources/goldin.shared.generated.resources/font/iranyekanmedium.ttf"
          as="font" type="font/ttf"
          crossorigin/>
    <link rel="preload"
          href="./composeResources/goldin.shared.generated.resources/font/iranyekanbold.ttf"
          as="font" type="font/ttf"
          crossorigin/>
    <!-- آیکون تب مرورگر (Favicon) -->
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>">

    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<div class="loading-container">

    <!-- لودینگ چرخشی وسط -->
    <div class="spinner">
        <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 50 50"
             role="presentation">
            <circle cx="25" cy="25" r="20" stroke="#f0f0f0" stroke-width="4" fill="none"/>
            <circle cx="25" cy="25" r="20" stroke="#d4af37" stroke-width="4" fill="none"
                    stroke-linecap="round" stroke-dasharray="90 125">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25"
                                  to="360 25 25" dur="1s" repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>

    <!-- متن اطلاع‌رسانی -->
    <div class="loading-text">
        <h2>در حال آماده‌سازی</h2>
        <p>لطفاً شکیبا باشید، در حال دریافت نیازمندی‌های اولیه...</p>
    </div>


</div>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
